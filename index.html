<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background-color: #F3C6F1;
    font-family: 'Courier New', Courier, monospace;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
    border-left: 2px solid #2D143D;
    border-right: 2px solid #2D143D;
  }
  /* Retro NSO Window Header */
  .header {
    flex-shrink: 0;
    background-color: #AADFFF;
    border: 2px solid #304179;
    border-bottom: none;
    padding: 3px 3px 3px 3px;
  }
  .win-title {
    display: flex;
    align-items: center;
    height: 22px;
    background-color: #F0D1F0;
    border: 2px solid #304179;
    padding: 0 3px 0 4px;
  }
  .win-icon {
    width: 11px;
    height: 11px;
    background-color: #4D21CE;
    border: 1px solid #2A1A7A;
    flex-shrink: 0;
    margin-right: 6px;
  }
  .win-name {
    font-family: 'Silkscreen', 'Press Start 2P', 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    color: #413B77;
    line-height: 1;
  }
  .win-btns {
    margin-left: auto;
    display: flex;
    gap: 3px;
  }
  .win-btn {
    width: 16px;
    height: 14px;
    background-color: #EFCEF9;
    border: 2px solid #3B2F8F;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .win-btn svg { display: block; shape-rendering: crispEdges; }
  #status-text { display: none; }

  .msg-row {
    display: flex;
    align-items: flex-start;
    max-width: 100%;
    animation: popIn 0.15s ease-out;
  }
  @keyframes popIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .row-ame {
    justify-content: flex-start;
  }
  .row-pchan {
    justify-content: flex-end;
  }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1.5px solid #C9A8D8;
    margin-right: 7px;
    image-rendering: pixelated;
    flex-shrink: 0;
    background: #FFF;
    box-shadow: none;
  }

  .bubble {
    max-width: 78%;
    padding: 6px 10px;
    border-radius: 10px;
    border: 1px solid #B8A0D0;
    box-shadow: none;
    word-wrap: break-word;
  }
  .ame-bubble {
    background-color: #D6ECFA;
    color: #1A56DB;
    font-family: 'Silkscreen', 'Press Start 2P', 'Courier New', monospace;
    -webkit-font-smoothing: none;
    -moz-osx-font-smoothing: grayscale;
    font-smooth: never;
    image-rendering: pixelated;
  }
  .ame-bubble .msg-text {
    color: #1A56DB;
    font-family: 'Silkscreen', 'Press Start 2P', 'Courier New', monospace;
    font-size: 12px;
    line-height: 1.4;
    letter-spacing: 0px;
    font-weight: 400;
    text-shadow: none;
    -webkit-font-smoothing: none;
    -moz-osx-font-smoothing: grayscale;
  }
  .ame-bubble .timestamp {
    color: #5B8FD9;
    font-family: 'Silkscreen', 'Press Start 2P', monospace;
    font-size: 7px;
    font-weight: 400;
    text-shadow: none;
    margin-top: 2px;
    line-height: 1;
    letter-spacing: 0.2px;
    opacity: 0.85;
  }
  .pchan-bubble {
    background-color: #D8F8FF;
    color: #2D143D;
  }
  .msg-text {
    font-size: 12px;
    line-height: 1.4;
    font-weight: 400;
  }
  .timestamp {
    font-size: 7px;
    color: #5B8FD9;
    margin-top: 2px;
    text-align: right;
    font-weight: 400;
    line-height: 1;
    letter-spacing: 0.2px;
    opacity: 0.85;
  }

  .read-label {
    align-self: flex-end;
    font-size: 7px;
    color: #FFFFFF;
    font-family: 'Press Start 2P', 'Courier New', monospace;
    text-transform: none;
    margin: -2px 6px 4px 0;
    text-align: right;
    letter-spacing: 0;
    text-shadow: none;
  }
  .sticker-msg-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }
  .chat-sticker {
    width: 88px;
    height: 88px;
    image-rendering: pixelated;
    object-fit: contain;
  }
  .timestamp-pill {
    background: rgba(255, 255, 255, 0.72);
    padding: 0px 4px;
    border-radius: 3px;
    font-size: 7px;
    color: #5B8FD9;
    font-weight: 400;
    margin-top: 1px;
    line-height: 1.2;
    letter-spacing: 0.2px;
    opacity: 0.9;
  }

  /* Official 8-Sticker P-Chan Tray - clean game look */
  .sticker-tray {
    background-color: #C9A8D8;
    border-top: none;
    padding: 6px 8px 10px 8px;
    flex-shrink: 0;
    position: relative;
  }
  .tray-label {
    color: #FFFFFF;
    font-size: 9px;
    font-weight: bold;
    margin-bottom: 6px;
    display: flex;
    justify-content: flex-end; /* only CLEAR LOG on the right */
    font-family: 'Silkscreen', 'Press Start 2P', monospace;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.35);
    letter-spacing: 0.5px;
  }
  .sticker-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    min-height: 70px;
  }
  .sticker-btn {
    height: 58px;
    background-color: transparent;   /* no highlight / cube */
    border: none;
    border-radius: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: none;
    transition: transform 0.05s, opacity 0.1s;
  }
  .sticker-btn:active {
    transform: scale(0.92);
    opacity: 0.75;
  }
  .tray-sticker {
    width: 46px;
    height: 46px;
    image-rendering: pixelated;
    object-fit: contain;
  }

  .chat-area {

  }

  .sticker-grid::after { content: none; }

const STORAGE_KEY = 'nso_jine_chat_history_v1';
let messages = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || [
  { id: '1', sender: 'ame', type: 'text', text: 'p-chan?', timestamp: getNowTime() }
];

let lastStickerTime = 0;
let spamCount = 0;
let recentStickers = [];

function getNowTime() {
  const d = new Date();
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function saveMessages() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(messages.slice(-80)));
}

function renderMessages() {
  const chatArea = document.getElementById('chat-area');
  chatArea.innerHTML = '';

  messages.forEach(msg => {
    if (msg.type === 'pill') {
      const prow = document.createElement('div');
      prow.className = 'pill-row';
      const pl = document.createElement('div');
      pl.className = 'pill';
      pl.textContent = msg.text;
      prow.appendChild(pl);
      chatArea.appendChild(prow);
      return;
    }
    const isAme = msg.sender === 'ame';
    const row = document.createElement('div');
    row.className = 'msg-row ' + (isAme ? 'row-ame' : 'row-pchan');

    if (isAme) {
      const avatarWrap = document.createElement('div');
      avatarWrap.className = 'avatar-wrap';

const SFX_BASE = {};
function playSfx(name) {
  try {
    if (!SFX_BASE[name]) { SFX_BASE[name] = new Audio(SFX[name]); SFX_BASE[name].preload = 'auto'; }
    const a = SFX_BASE[name].cloneNode();   // clone so rapid sounds can overlap
    a.volume = 1;
    const pr = a.play();
    if (pr && pr.catch) pr.catch(() => {});
  } catch (e) {}
}

function addAmeMessage(text) {
  if (Array.isArray(text)) {
    text.forEach((t, i) => setTimeout(() => addAmeMessage(t), i * 1600));
    return;
  }
  const statusEl = document.getElementById('status-text');
  statusEl.textContent = 'typing...';
  setTimeout(() => {
    statusEl.textContent = '● ONLINE';
    messages.push({
      id: Date.now().toString() + Math.random(),
      sender: 'ame',
      type: 'text',
      text: text,
      timestamp: getNowTime()
    });
    saveMessages();
    playSfx('receive');
    renderMessages();
  }, 700);
}


// --- Variety: shuffle-bag so every line shows before any repeats ---
function nextReply(stamp) {
  if (!stamp._bag || stamp._bag.length === 0) {
    const bag = stamp.replies.map((_, i) => i);
    for (let i = bag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [bag[i], bag[j]] = [bag[j], bag[i]];
    }
    // avoid same line twice in a row across refills
    if (bag.length > 1 && bag[bag.length - 1] === stamp._last) {
      [bag[0], bag[bag.length - 1]] = [bag[bag.length - 1], bag[0]];
    }
    stamp._bag = bag;
  }
  const idx = stamp._bag.pop();
  stamp._last = idx;
  return stamp.replies[idx];
}

// --- Read receipt + cool-down: she waits, reads the burst, replies once ---
let pendingStamps = [];
let replyTimer = null;

function markRead() {
  playSfx('send');   // plays once when "Read" appears
  messages.forEach(m => { delete m.read; });
  for (let i = messages.length - 1; i >= 0; i--) {
    if (messages[i].sender === 'pchan') { messages[i].read = true; break; }
  }
  saveMessages();
  renderMessages();
}

function amePickReply() {
  const burst = pendingStamps;
  pendingStamps = [];
  replyTimer = null;
  if (burst.length === 0) return;

  // 4+ stickers in a row = spam reaction (game behaviour)
  if (burst.length >= 4) {
    const spamReplies = [
      "spam me again and ill block you.",
      "im never checking my dms ever again",
      "ENOOOOOOOUUUUUUUGGGGGHHHH"
    ];
    addAmeMessage(spamReplies[Math.floor(Math.random() * spamReplies.length)]);
    return;
  }

  // Otherwise she answers just ONE sticker from the burst
  const stamp = burst[Math.floor(Math.random() * burst.length)];
  const useSticker = Math.random() < 0.38;
  if (useSticker && typeof AME_STICKERS !== "undefined" && AME_STICKERS.length > 0) {
    const herStamp = AME_STICKERS[Math.floor(Math.random() * AME_STICKERS.length)];
    messages.push({
      id: Date.now().toString() + Math.random(),
      sender: "ame",
      type: "sticker",
      img: herStamp.img,
      timestamp: getNowTime()
    });
    saveMessages();
    playSfx('receive');
    renderMessages();
    if (Math.random() < 0.35) {
      const shorts = ["...", "hmph", "whatever", "lol", "ok...", "p-chan...", "♡"];
      setTimeout(() => addAmeMessage(shorts[Math.floor(Math.random() * shorts.length)]), 550);
    }
  } else {
    addAmeMessage(nextReply(stamp));
  }
}

function handleStickerClick(stamp) {
  if (auto.locked) return;
  onPlayerReply();
  askNotifyPermission();
  const now = Date.now();

  messages.push({
    id: now.toString(),
    sender: 'pchan',
    type: 'sticker',
    img: stamp.img,
    timestamp: getNowTime()
  });
  // new sticker sent -> previous "Read" mark goes away until she reads again
  messages.forEach(m => { delete m.read; });
  saveMessages();
  renderMessages();

  pendingStamps.push(stamp);

  // every new sticker restarts her cool-down; she reads, then replies once
  if (replyTimer) clearTimeout(replyTimer);
  const wait = 1400 + Math.random() * 1100;   // 1.4 - 2.5 seconds after your last sticker
  replyTimer = setTimeout(() => {
    markRead();
    setTimeout(amePickReply, 450 + Math.random() * 450);
  }, wait);
}

// === TIME-BASED AUTO CHAT (realistic timing) ===
function getTimeOfDay() {
  const hour = new Date().getHours();
  // Ame is not a morning person — wakes around noon
  if (hour >= 10 && hour < 17) return 'noon';
  return 'night';
}

let lastAutoMessageTime = 0;
const MIN_COOLDOWN = 4 * 60 * 1000;   // minimum 4 minutes between auto messages
const CHECK_INTERVAL = 90 * 1000;     // check every 90 seconds

function trySendAutoMessage() {
  const now = Date.now();

  // Hard cooldown so she never spams
  if (now - lastAutoMessageTime < MIN_COOLDOWN) return;

  const period = getTimeOfDay();
  const pool = AME_MESSAGES[period];

  // Probability: quieter in daytime, more clingy at night
  const chance = period === 'noon' ? 0.18 : 0.28;

  if (Math.random() > chance) return;

  // time-of-day pill ("Noon" / "Night") when the period changes, like the game
  const pillLabel = period === 'noon' ? 'Noon' : 'Night';
  const lastPill = [...messages].reverse().find(m => m.type === 'pill');
  if (!lastPill || lastPill.text !== pillLabel) {
    messages.push({ id: Date.now().toString() + 'pill', sender: 'sys', type: 'pill', text: pillLabel, timestamp: getNowTime() });
    saveMessages();
    renderMessages();
  }

  // Sometimes send sticker instead (especially at night)
  if (period === 'night' && Math.random() < 0.22 && typeof AME_STICKERS !== "undefined" && AME_STICKERS.length > 0) {
    const herStamp = AME_STICKERS[Math.floor(Math.random() * AME_STICKERS.length)];
    messages.push({
      id: Date.now().toString() + Math.random(),
      sender: "ame",
      type: "sticker",
      img: herStamp.img,
      timestamp: getNowTime()
    });
    saveMessages();
    playSfx('receive');
    renderMessages();
  } else {
    const line = pool[Math.floor(Math.random() * pool.length)];
    addAmeMessage(line);
  }

  lastAutoMessageTime = now;
}

const AUTO_KEY = 'nso_jine_auto_v1';
const FAST_TEST = (location.hash === '#fast');   // add #fast to the URL to test idle messages quickly
const IDLE_T1_MS = FAST_TEST ? 15 * 1000 : 5 * 60 * 1000;     // tier 1: 5 minutes
const IDLE_T2_MS = FAST_TEST ? 40 * 1000 : 15 * 60 * 1000;    // tier 2: 15 minutes
const FLATLINE_AT = 5;                // ignored prompts before flatline
const DROP_CHANCE = 0.7;              // chance she starts a chat when a time block begins

let auto = { dropKey: '', bags: {}, last: {}, awaiting: null, pending: null, streak: 0, locked: false };
try {
  const raw = localStorage.getItem(AUTO_KEY);
  if (raw) auto = Object.assign(auto, JSON.parse(raw));
} catch (e) {}
if (auto.ver !== 2) { auto.bags = {}; auto.ver = 2; }
function saveAuto() { try { localStorage.setItem(AUTO_KEY, JSON.stringify(auto)); } catch (e) {} }

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function typingDelay(t) { return Math.min(1500, 600 + t.length * 10); }   // short pause, no typing indicator

function scrollChatBottom() {
  const ca = document.getElementById('chat-area');
  if (ca) ca.scrollTop = ca.scrollHeight;
}

function pushAme(text) {
  messages.push({ id: Date.now().toString() + Math.random(), sender: 'ame', type: 'text', text: text, timestamp: getNowTime() });
  saveMessages();
  playSfx('receive');
  renderMessages();
}

let ameBusy = 0;
let autoEpoch = 0;
async function sendAmeLines(lines, instant) {
  ameBusy++;
  const epoch = autoEpoch;
  try {
    for (const t of lines) {
      if (!instant) await sleep(typingDelay(t));   // short pause, no typing indicator
      if (epoch !== autoEpoch) break;               // chat was cleared meanwhile
      pushAme(t);
    }
  } finally { ameBusy--; }
}

// ---- real-time blocks ----
function currentBlock(d) {
  d = d || new Date();
  const h = d.getHours();
  if (h >= 12 && h < 18) return 'noon';    // 12:00 PM - 5:59 PM
  if (h >= 18 && h < 21) return 'dusk';    // 6:00 PM - 8:59 PM
  if (h >= 21 || h < 5) return 'night';    // 9:00 PM - 4:59 AM
  return null;                             // 5 AM - 11:59 AM: she's asleep
}
function blockKey(d) {
  d = d || new Date();
  const b = currentBlock(d);
  if (!b) return '';
  const x = new Date(d.getTime());
  if (d.getHours() < 5) x.setDate(x.getDate() - 1);   // after midnight still belongs to last night
  return x.getFullYear() + '-' + (x.getMonth() + 1) + '-' + x.getDate() + '|' + b;
}
function blockItems(block) {
  const ids = [];
  const pool = block === 'noon' ? JINE_SCRIPT.noon_randoms : JINE_SCRIPT.dusk_and_night_randoms;
  const tag = block === 'noon' ? 'noon' : 'dn';
  pool.forEach((_, i) => ids.push('r:' + tag + ':' + i));
  JINE_SCRIPT.green_text_events.forEach((ev, i) => { if (ev.time_block === block) ids.push('g:' + i); });
  return ids;
}

// ---- non-repeating shuffled queue ----
function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function nextFromBag(bagKey, ids, lastKey) {
  let bag = auto.bags[bagKey];
  if (!Array.isArray(bag) || bag.length === 0 || bag.some(x => ids.indexOf(x) === -1)) {
    bag = shuffled(ids);
  }
  let pick = bag.pop();
  // never the same thing twice in a row, even across refills / blocks
  if (pick === auto.last[lastKey] && ids.length > 1) {
    if (bag.length === 0) bag = shuffled(ids.filter(x => x !== pick));
    bag.unshift(pick);
    pick = bag.pop();
  }
  auto.bags[bagKey] = bag;
  auto.last[lastKey] = pick;
  saveAuto();
  return pick;
}

// ---- pills ----
function ensurePill(block) {
  const label = { noon: 'Noon', dusk: 'Dusk', night: 'Night' }[block];
  const lp = [...messages].reverse().find(m => m.type === 'pill');
  if (!lp || lp.text !== label) {
    messages.push({ id: Date.now().toString() + 'pill', sender: 'sys', type: 'pill', text: label, timestamp: getNowTime() });
    saveMessages();
    renderMessages();
  }
}

// ---- drops ----
async function startDrop(block) {
  if (!block || auto.locked || ameBusy > 0 || auto.pending || auto.awaiting) return;
  const pick = nextFromBag('drop:' + block, blockItems(block), 'drop');
  ensurePill(block);
  if (pick.charAt(0) === 'g') {
    const idx = parseInt(pick.slice(2), 10);
    await sendAmeLines(JINE_SCRIPT.green_text_events[idx].ame_prompt);
    auto.pending = { ev: idx };
    saveAuto();
    showGreenBar();
  } else {
    const parts = pick.split(':');
    const pool = parts[1] === 'noon' ? JINE_SCRIPT.noon_randoms : JINE_SCRIPT.dusk_and_night_randoms;
    await sendAmeLines(pool[parseInt(parts[2], 10)]);
  }
  startAwaiting();
}
function checkDrops() {
  if (auto.locked || ameBusy > 0 || auto.awaiting || auto.pending) return;
  const key = blockKey();
  if (!key || auto.dropKey === key) return;
  auto.dropKey = key;                       // one roll per time block
  saveAuto();
  if (Math.random() < DROP_CHANCE) {
    const block = currentBlock();
    setTimeout(() => startDrop(block), 1500 + Math.random() * 2500);
  }
}

async function onGreenChoice(i) {
  if (!auto.pending || auto.locked) return;

  await sleep(1100 + Math.random() * 700);
  markRead();
  await sleep(700 + Math.random() * 500);
  await sendAmeLines(opt.ame_reply);
}

// ---- idle timer + pestering ----
function startAwaiting() {
  auto.awaiting = { since: Date.now(), t1: false, t2: false };
  saveAuto();
}
function onPlayerReply() {
  auto.awaiting = null;
  auto.streak = 0;
  saveAuto();
}
function askNotifyPermission() {
  try {
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  } catch (e) {}
}
function notifyAme(body) {
  if (!document.hidden) return;
  try {
    if (window.JINE_NATIVE && typeof window.JINE_NATIVE.notify === 'function') {   // hook for the APK wrapper
      window.JINE_NATIVE.notify('Ame-chan', body);
      return;
    }
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification('Ame-chan', { body: body, icon: AME_AVATAR, tag: 'jine-idle' });
    }
  } catch (e) {}
}
function idlePick(tier) {
  const pool = tier === 1 ? JINE_SCRIPT.idle_tier_1 : JINE_SCRIPT.idle_tier_2;
  const k = nextFromBag('idle' + tier, pool.map((_, i) => String(i)), 'idle' + tier);
  return pool[parseInt(k, 10)];
}
async function checkIdle(instant) {
  const a = auto.awaiting;
  if (!a || auto.locked || ameBusy > 0) return;
  const el = Date.now() - a.since;
  if (!a.t1 && el >= IDLE_T1_MS) {
    a.t1 = true;
    saveAuto();
    const line = idlePick(1);
    notifyAme(line);
    await sendAmeLines([line], instant);
  }
  if (!a.t2 && el >= IDLE_T2_MS) {
    a.t2 = true;
    auto.awaiting = null;
    auto.streak++;                          // another prompt ignored
    saveAuto();
    const line = idlePick(2);
    notifyAme(line);
    await sendAmeLines([line], instant);
    if (auto.streak >= FLATLINE_AT) await flatline(instant);
  }
}

// ---- flatline ----
async function flatline(instant) {
  auto.locked = true;
  auto.pending = null;
  auto.awaiting = null;
  saveAuto();
  hideGreenBar();
  notifyAme(JINE_SCRIPT.flatline_state[0]);
  await sendAmeLines(JINE_SCRIPT.flatline_state, instant);
  showLock();
}
function showLock() {
  hideGreenBar();
  const o = document.getElementById('lock-overlay');
  if (o) o.classList.add('show');
}
function resetLock() {
  auto.locked = false;
  auto.streak = 0;
  auto.awaiting = null;
  auto.pending = null;
  saveAuto();
  const o = document.getElementById('lock-overlay');
  if (o) o.classList.remove('show');
}

// ---- app open / foreground / ticker ----
async function onAppOpen() {
  if (auto.locked) { showLock(); return; }
  await checkIdle(true);                    // catch up: she pestered while you were away
  if (!auto.locked) { auto.awaiting = null; saveAuto(); }   // opening the app counts as seeing it
  checkDrops();
}
function jineAutoInit() {
  const rb = document.getElementById('lock-reset');
  if (rb) rb.onclick = resetLock;
  if (auto.locked) showLock();
  else if (auto.pending) showGreenBar();
  onAppOpen();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) onAppOpen(); });
  setInterval(() => { checkIdle(false); checkDrops(); }, 15000);
}


document.getElementById('clear-btn').onclick = () => {
  messages = [{ id: Date.now().toString(), sender: 'ame', type: 'text', text: 'p-chan?', timestamp: getNowTime() }];
  autoEpoch++;                                   // cancel any lines still queued from before
  auto.pending = null; auto.awaiting = null; auto.dropKey = ''; saveAuto(); hideGreenBar();
  if (!auto.locked && currentBlock()) {
    const blk = currentBlock();
    setTimeout(() => startDrop(blk), 1500 + Math.random() * 1500);   // she starts a new chat right after a clear
  }
  saveMessages();
  renderMessages();
};

// Start
initTray();
renderMessages();
jineAutoInit();


// keep the newest message clear of the floating tray
(function () {
  const tray = document.querySelector('.sticker-tray');
  if (!tray) return;
  const setTrayH = () => {
    document.documentElement.style.setProperty('--tray-h', tray.offsetHeight + 'px');
    const ca = document.getElementById('chat-area');
    if (ca) ca.scrollTop = ca.scrollHeight;
  };
  setTrayH();
  if (window.ResizeObserver) new ResizeObserver(setTrayH).observe(tray);
  window.addEventListener('resize', setTrayH);
})();
</script>
